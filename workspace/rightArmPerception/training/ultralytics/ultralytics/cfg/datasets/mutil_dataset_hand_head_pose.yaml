# Hand Keypoints dataset by Ultralytics
# Documentation: https://docs.ultralytics.com/datasets/pose/hand-keypoints/
# Example usage: yolo train data=hand-keypoints.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── hand-keypoints  ← downloads here (369 MB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: '' # 可以留空或设置通用根目录 
train: 
  - /home/datasets/gesture_dataset/Onehand10k/ultralytics_format/images/train
  - /home/datasets/gesture_dataset/Onehand10k/ultralytics_format/images/valid
  - /home/datasets/gesture_dataset/my_hand_keypoints/images/train
  - /home/datasets/gesture_dataset/Halpe/ultralytics_format/images/train
  - /home/datasets/gesture_dataset/FreiHAND/ultralytics_format/images/training
  - /home/datasets/gesture_dataset/coco_wholebody/ultralytics_format/images/train


val:
  - /home/datasets/gesture_dataset/Onehand10k/ultralytics_format/images/test
  - /home/datasets/gesture_dataset/my_hand_keypoints/images/val
  - /home/datasets/gesture_dataset/Halpe/ultralytics_format/images/val
  - /home/datasets/gesture_dataset/FreiHAND/ultralytics_format/images/evaluation
  - /home/datasets/gesture_dataset/coco_wholebody/ultralytics_format/images/val



# Keypoints
kpt_shape: [21, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
flip_idx:
  [0, 1, 2, 4, 3, 10, 11, 12, 13, 14, 5, 6, 7, 8, 9, 15, 16, 17, 18, 19, 20]

# Classes
names:
  0: hand
  1: head



# 缓存设置
cache: False  # 添加这一行，禁用缓存


# Keypoint names per class
kpt_names:
  0:
    - wrist
    - thumb_cmc
    - thumb_mcp
    - thumb_ip
    - thumb_tip
    - index_mcp
    - index_pip
    - index_dip
    - index_tip
    - middle_mcp
    - middle_pip
    - middle_dip
    - middle_tip
    - ring_mcp
    - ring_pip
    - ring_dip
    - ring_tip
    - pinky_mcp
    - pinky_pip
    - pinky_dip
    - pinky_tip


